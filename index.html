:root{--paper:#f5f0e8;--ivory:#fffcf7;--beige:#d8c5ae;--coffee:#9b826c;--dark:#493a30;--muted:#8d7968;--line:#e9ded0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--dark);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:650;margin:0}h1{font-size:28px}h2{font-size:23px}h3{font-size:19px}p{margin:6px 0}header{padding:20px 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1100px;margin:auto}.brand{font-family:Inter,system-ui,sans-serif;font-weight:700;letter-spacing:.65px;font-size:19px}.sub{font-size:12px;color:var(--muted)}.layout{max-width:1100px;margin:auto;padding:0 15px 110px}.card{background:var(--ivory);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #493a3008}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.pill{background:#eee5da;color:#745a45;border-radius:30px;padding:5px 10px;font-size:12px;display:inline-block}.btn{background:var(--dark);border:1px solid var(--dark);color:white;padding:10px 14px;border-radius:11px}.btn.secondary{background:var(--ivory);color:var(--dark);border-color:var(--beige)}.btn.ghost{background:transparent;border-color:transparent;color:var(--dark)}.btn.smallbtn{font-size:12px;padding:6px 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stat{padding:15px;background:var(--ivory);border:1px solid var(--line);border-radius:14px}.stat b{display:block;font:700 26px Inter,system-ui,sans-serif}.bookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bookcard{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;text-align:left;color:inherit}.cover{width:100%;aspect-ratio:2/3;background:linear-gradient(145deg,#bfa78d,#e5d7c5 65%,#ad8d71);border-radius:8px;display:grid;place-items:center;overflow:hidden;color:#fff;font:700 28px Inter,system-ui,sans-serif}.cover img{width:100%;height:100%;object-fit:cover}.bookcard strong{display:block;margin:9px 0 2px;overflow-wrap:anywhere}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.chips{display:flex;gap:7px;overflow:auto;padding:5px 0}.chip{border:1px solid var(--beige);background:var(--ivory);color:var(--dark);border-radius:25px;padding:7px 12px;white-space:nowrap}.chip.active{background:var(--coffee);color:#fff}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-size:13px;color:#705846}input,select,textarea{border:1px solid var(--beige);background:#fffefa;border-radius:10px;padding:11px;width:100%;color:var(--dark)}textarea{min-height:95px;resize:vertical}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffcf7f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:5px 0}.nav span{font-size:21px}.nav.active{color:var(--dark);font-weight:700}.fab{position:fixed;bottom:88px;right:18px;width:53px;height:53px;border:0;border-radius:50%;background:var(--dark);color:#fff;font-size:30px;box-shadow:0 5px 15px #493a3040;z-index:9}.modalbg{position:fixed;inset:0;background:#271c1680;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);width:100%;max-width:570px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px}.item{background:var(--ivory);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}.item.overdue{background:#f5e8e4}.item.done{background:#ede7df;color:#948679}.item.done .taskname{text-decoration:line-through}.taskname{font-weight:600}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{border:1px solid var(--beige);background:var(--ivory);border-radius:10px;padding:8px 10px;white-space:nowrap;color:var(--dark)}.tab.active{background:#e7d8c5}.progress{height:8px;background:#e9ded0;border-radius:9px;overflow:hidden}.progress div{height:100%;background:var(--coffee)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--ivory);color:var(--dark);padding:5px 2px;font-size:12px}.day.selected{background:#e7d8c5;border-color:var(--coffee)}.day.today{outline:1px solid var(--coffee)}.dot{display:block;width:5px;height:5px;background:var(--coffee);border-radius:50%;margin:3px auto}.desktopnav{display:none}.empty{padding:25px 12px;text-align:center;color:var(--muted)}.empty .emoji{font-size:30px}.note{border-left:3px solid var(--coffee);padding-left:12px}.detailcover{width:98px;flex:none}.detailcover .cover{width:98px}.warn{background:#f5e8e4;padding:10px;border-radius:9px;color:#86594b}.menu{position:absolute;right:14px;top:62px;background:var(--ivory);padding:10px;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #493a3025;z-index:12}.menu button{display:block;border:0;background:none;padding:10px;text-align:left;width:100%}@media(min-width:780px){.layout{padding-left:190px;padding-bottom:45px}.bottom{display:none}.desktopnav{display:flex;position:fixed;top:85px;left:max(12px,calc((100vw - 1100px)/2));width:160px;flex-direction:column;gap:6px}.desktopnav .nav{flex-direction:row;gap:10px;font-size:14px;padding:11px;text-align:left;border-radius:12px}.desktopnav .nav.active{background:#e7d8c5}.fab{right:max(24px,calc((100vw - 1050px)/2))}.bookgrid{grid-template-columns:repeat(4,1fr)}.modalbg{align-items:center}.modal{border-radius:20px}.grid{grid-template-columns:repeat(4,1fr)}}

</style></head><body><header><div><div class="brand">THE BOOK JOURNAL</div><div class="sub">Мой книжный ежедневник</div></div><div class="authrow"><span id="cloudstatus" class="cloudstatus"></span><button class="btn secondary smallbtn" id="logoutbtn" hidden>Выйти</button></div><button class="btn secondary smallbtn" id="menubtn" aria-label="Дополнительное меню">☰ Меню</button><div id="menu" class="menu" hidden></div></header><aside class="desktopnav" id="desktopnav"></aside><main class="layout" id="app"></main><nav class="bottom" id="bottomnav"></nav><button class="fab" id="add" aria-label="Добавить">+</button><div id="modalhost"></div><div id="authgate"><div class="authcard"><div class="brand">THE BOOK JOURNAL ♡</div><h1>Личный книжный ежедневник</h1><p class="sub">Закрытая библиотека. Войди в свою учётную запись, созданную в Supabase Authentication.</p><form id="loginform"><label>Электронная почта<input type="email" id="loginemail" required autocomplete="username"></label><label>Пароль<input type="password" id="loginpassword" required autocomplete="current-password"></label><button class="btn" type="submit" id="loginbtn">Войти</button></form><div id="autherror" class="autherror" role="alert"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const KEY='tbj-v1';const stages=['Перевод','Редактура','Вычитка','Оформление','Готово','Опубликовано'];const shelves=['На рассмотрении','В планах','В работе','Готовые','Опубликованные','Отложенные'];const icons={home:'⌂',books:'▥',calendar:'▦',work:'▤',tasks:'☑'};const nav=[['home','Главная'],['books','Книги'],['calendar','Календарь'],['work','Работа'],['tasks','Задачи']];let db={books:[],tasks:[],events:[],notes:[]},page='home',filter='Все',search='',selectedDate=today(),month=selectedDate.slice(0,7),stageTab='Перевод',detailId=null,detailTab='Обзор',menuOpen=false;function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.books)&&Array.isArray(x.tasks)?x:{books:[],tasks:[],events:[],notes:[]}}catch{return {books:[],tasks:[],events:[],notes:[]}}}function save(){queueCloudSave();return true}function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmt(d){if(!d)return 'Без даты';let a=d.split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d}function book(id){return db.books.find(b=>b.id===id)}function cover(b){return `<div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="Обложка">`:'✦'}</div>`}function head(t,extra=''){return `<div class="sectionhead"><h2>${t}</h2>${extra}</div>`}function empty(t,s=''){return `<div class="empty"><div class="emoji">♡</div><p>${t}</p><span class="small">${s}</span></div>`}function navRender(){let h=nav.map(([k,t])=>`<button class="nav ${page===k?'active':''}" data-page="${k}"><span>${icons[k]}</span>${t}</button>`).join('');document.getElementById('bottomnav').innerHTML=h;document.getElementById('desktopnav').innerHTML=h}function setPage(p){page=p;detailId=null;menuOpen=false;render();scrollTo(0,0)}function render(){navRender();document.getElementById('menu').hidden=!menuOpen;document.getElementById('menu').innerHTML=['Серии','Статистика','Заметки','Настройки'].map(x=>`<button data-extra="${x}">${x}</button>`).join('');document.getElementById('app').innerHTML=detailId?detailView():({home:homeView,books:booksView,calendar:calendarView,work:workView,tasks:tasksView,series:seriesView,stats:statsView,notes:notesView,settings:settingsView}[page]||homeView)()}
function homeView(){let active=db.books.filter(b=>stages.slice(0,4).includes(b.stage)&&!b.paused);let upcoming=[...db.events.map(e=>({title:e.title,date:e.date})),...db.books.filter(b=>b.planned).map(b=>({title:'Публикация · '+b.title,date:b.planned}))].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return `<h1>Моя книжная полка</h1><p class="muted">Место для каждой истории и каждого этапа её создания.</p><div class="grid"><div class="stat"><b>${db.books.length}</b>Книг</div><div class="stat"><b>${active.length}</b>В работе</div><div class="stat"><b>${db.tasks.filter(t=>!t.done).length}</b>Активных задач</div><div class="stat"><b>${db.books.filter(b=>b.stage==='Опубликовано').length}</b>Опубликовано</div></div>${head('Сейчас в работе',`<button class="btn ghost smallbtn" data-page="work">Все этапы →</button>`)}${active.length?`<div class="bookgrid">${active.slice(0,4).map(bookTile).join('')}</div>`:empty('Пока нет активных книг','Добавьте первую книгу кнопкой +')}${head('Ближайшие события')}${upcoming.length?upcoming.map(e=>`<div class="item row between"><span>${esc(e.title)}</span><span class="small muted">${fmt(e.date)}</span></div>`).join(''):empty('Пока нет запланированных событий')}${head('Задачи',`<button class="btn ghost smallbtn" data-page="tasks">Все задачи →</button>`)}${taskList(db.tasks.filter(t=>!t.done).slice(0,3))}`}
function bookTile(b){return `<button class="bookcard" data-book="${b.id}">${cover(b)}<strong>${esc(b.title)}</strong><div class="small muted">${esc(b.author)}</div><span class="pill">${esc(b.paused?'На паузе':b.stage)}</span></button>`}function booksView(){let list=db.books.filter(b=>(filter==='Все'||b.shelf===filter)&&(`${b.title} ${b.author} ${b.series||''} ${b.titleEn||''}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));return `<h1>Библиотека</h1><div class="field"><input id="search" placeholder="Поиск по книгам, авторам и сериям" value="${esc(search)}"></div><div class="chips">${['Все',...shelves].map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div>${head(`Книги · ${list.length}`,`<button class="btn secondary smallbtn" data-create="book">+ Книга</button>`)}${list.length?`<div class="bookgrid">${list.map(bookTile).join('')}</div>`:empty('Здесь пока нет книг','Добавьте книгу, чтобы начать вести библиотеку')}`}
function workView(){let list=db.books.filter(b=>b.stage===stageTab);return `<h1>Работа</h1><p class="muted">Этапы переводческих проектов</p><div class="chips">${stages.slice(0,4).map(s=>`<button class="chip ${stageTab===s?'active':''}" data-stage="${s}">${s} · ${db.books.filter(b=>b.stage===s).length}</button>`).join('')}</div>${head(stageTab)}${list.filter(b=>!b.paused).length?list.filter(b=>!b.paused).map(workItem).join(''):empty('На этом этапе пока нет активных книг')}${list.some(b=>b.paused)?`<details class="card"><summary>На паузе · ${list.filter(b=>b.paused).length}</summary>${list.filter(b=>b.paused).map(workItem).join('')}</details>`:''}`}
function workItem(b){let n=stageTab==='Перевод'?b.translated:stageTab==='Редактура'?b.edited:b.proofread;return `<div class="item row between"><div><b>${esc(b.title)}</b><div class="small muted">${esc(b.author)} · Глав: ${n||0}${b.total?'/'+b.total:''}</div></div><button class="btn secondary smallbtn" data-book="${b.id}">Открыть</button></div>`}
function taskList(tasks){return tasks.length?tasks.map(t=>`<div class="item ${t.done?'done':''} ${!t.done&&t.due&&t.due<today()?'overdue':''} row"><input type="checkbox" style="width:20px;flex:none" data-check="${t.id}" ${t.done?'checked':''} aria-label="Выполнить задачу"><div style="flex:1;min-width:0" data-task="${t.id}"><div class="taskname">${esc(t.title)}</div><div class="small muted">${t.bookId?esc(book(t.bookId)?.title||'')+' · ':''}${t.due?fmt(t.due):'Без срока'}${t.priority==='Высокий'?' · Высокий приоритет':''}</div></div><button class="btn ghost smallbtn" data-task="${t.id}" aria-label="Открыть задачу">⋯</button></div>`).join(''):empty('Задач пока нет')}
function tasksView(){let a=db.tasks.filter(t=>!t.done).sort((x,y)=>({Высокий:0,Обычный:1,Низкий:2}[x.priority]||1)-({Высокий:0,Обычный:1,Низкий:2}[y.priority]||1)||(x.due||'9999').localeCompare(y.due||'9999'));return `<h1>Задачи</h1>${head('Активные',`<button class="btn secondary smallbtn" data-create="task">+ Задача</button>`)}${taskList(a)}${head(`Выполненные · ${db.tasks.filter(t=>t.done).length}`)}${taskList(db.tasks.filter(t=>t.done))}`}
function calendarView(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array(offset).fill('<div></div>');for(let d=1;d<=days;d++){let date=`${month}-${String(d).padStart(2,'0')}`;let count=db.events.filter(e=>e.date===date).length+db.tasks.filter(t=>t.due===date).length+db.books.filter(b=>b.planned===date||b.actual===date).length;cells.push(`<button class="day ${date===selectedDate?'selected':''} ${date===today()?'today':''}" data-date="${date}">${d}${count?`<span class="dot"></span>${count>2?`<span class="small">${count}</span>`:''}`:''}</button>`)}let items=[...db.events.filter(e=>e.date===selectedDate).map(e=>({name:e.title,type:'Событие'})),...db.tasks.filter(t=>t.due===selectedDate).map(t=>({name:t.title,type:'Задача'})),...db.books.filter(b=>b.planned===selectedDate).map(b=>({name:b.title,type:'План публикации'})),...db.books.filter(b=>b.actual===selectedDate).map(b=>({name:b.title,type:'Опубликовано'}))];return `<h1>Календарь</h1><div class="card"><div class="row between"><button class="btn ghost" data-month="-1">‹</button><h3>${new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h3><button class="btn ghost" data-month="1">›</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells.join('')}</div></div>${head(`События · ${fmt(selectedDate)}`,`<button class="btn secondary smallbtn" data-create="event">+ Событие</button>`)}${items.length?items.map(e=>`<div class="item"><span class="pill">${e.type}</span> ${esc(e.name)}</div>`).join(''):empty('На этот день событий нет')}<p class="small muted">Планы без точного дня появятся в карточке книги.</p>`}
function bookHistory(b){return Array.isArray(b.history)?b.history:[]}
function logBook(b,action){if(!b)return;b.history=bookHistory(b);b.history.unshift({id:uid(),at:new Date().toISOString(),action});if(b.history.length>150)b.history.length=150;b.updated=new Date().toISOString()}

function bookPlansView(b){let dates=[['Начало работы',b.started],['Планируемая публикация',b.planned],['Фактическая публикация',b.actual]],dated=dates.filter(x=>x[1]).sort((a,c)=>a[1].localeCompare(c[1])),emptyDates=dates.filter(x=>!x[1]);let related=db.events.filter(e=>e.bookId===b.id&&e.date).map(e=>({name:e.title,date:e.date,type:'Событие'}));let timeline=[...dated.map(([name,date])=>({name,date,type:name})),...related].sort((a,c)=>a.date.localeCompare(c.date));return `<button class="btn secondary" data-editbook="${b.id}">Изменить важные даты</button><div class="book-section-title">Хронология</div>${timeline.length?timeline.map(x=>`<div class="timeline-item ${x.type==='Фактическая публикация'?'published':''}"><div class="timeline-date">${fmt(x.date)}</div><b>${esc(x.name)}</b>${x.type==='Фактическая публикация'&&b.planned?`<div class="small muted">${diffDates(b.planned,b.actual)}</div>`:''}</div>`).join(''):empty('Пока нет дат')} ${emptyDates.length?`<div class="small muted" style="margin:14px 0">Не указано: ${emptyDates.map(x=>x[0].toLowerCase()).join(', ')}.</div>`:''}${head('Задачи книги',`<button class="btn secondary smallbtn" data-create="task" data-linked="${b.id}">+ Задача</button>`)}${taskList(db.tasks.filter(t=>t.bookId===b.id))}`}

 const {data,error}=await client.from('journal_data').select('payload').eq('user_id',user.id).maybeSingle();if(error)throw error;

 if(remote&&!validPayload(remote))throw Error('Данные облака имеют неизвестный формат. Ничего не перезаписано.');
 if(!remote){remote={books:[],tasks:[],events:[],notes:[]};const {error:insertError}=await client.from('journal_data').insert({user_id:user.id,payload:remote});if(insertError&&insertError.code!=='23505')throw insertError;if(insertError){const {data:existing,error:readError}=await client.from('journal_data').select('payload').eq('user_id',user.id).single();if(readError)throw readError;remote=existing.payload}}
 db=remote;revision=0;savedRevision=0;cloudReady=true;gate.hidden=true;document.getElementById('logoutbtn').hidden=false;cloudStatus('Облако подключено');render();
 const local=load();if((local.books.length||local.tasks.length||local.events.length||local.notes.length)&&!(db.books.length||db.tasks.length||db.events.length||db.notes.length)){
  if(confirm('Найдены записи из прежней локальной версии. Перенести их в облако? Перед переносом рекомендуем сохранить резервную копию JSON.')){db=local;queueCloudSave();render()}
 }else if(local.books.length||local.tasks.length||local.events.length||local.notes.length){cloudStatus('Локальные записи не перенесены');}
}
async function onSignedIn(user){try{await loadCloud(user)}catch(e){cloudReady=false;gate.hidden=false;document.getElementById('autherror').textContent='Не удалось загрузить защищённые данные: '+e.message;cloudStatus('Ошибка подключения',true)}}
async function startCloud(){
 document.getElementById('logoutbtn').onclick=async()=>{if(revision!==savedRevision){alert('Есть несохранённые изменения. Повтори сохранение перед выходом.');flushCloudSave();return}cloudReady=false;activeUser=null;db={books:[],tasks:[],events:[],notes:[]};gate.hidden=false;document.getElementById('logoutbtn').hidden=true;await client.auth.signOut();cloudStatus('');document.getElementById('app').innerHTML=''};
 statusEl.onclick=()=>{if(revision>savedRevision)flushCloudSave()};statusEl.style.cursor='pointer';
 document.getElementById('loginform').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('loginbtn'),errorEl=document.getElementById('autherror');btn.disabled=true;btn.textContent='Входим…';errorEl.textContent='';try{if(!client)throw Error('Библиотека подключения не загрузилась. Проверь интернет.');const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('loginemail').value.trim(),password:document.getElementById('loginpassword').value});if(error)throw error;await onSignedIn(data.user)}catch(err){errorEl.textContent='Ошибка входа: '+err.message}finally{btn.disabled=false;btn.textContent='Войти'}};
 try{if(!window.supabase?.createClient)throw Error('Не удалось загрузить модуль Supabase. Проверь интернет.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')console.warn(error.message);if(data?.user)await onSignedIn(data.user);else{gate.hidden=false;cloudStatus('Вход не выполнен')}}catch(e){document.getElementById('autherror').textContent=e.message}
}


// Private Supabase Storage. Metadata lives in the existing protected journal_data payload.
const MATERIAL_BUCKET='book-materials';
const MATERIAL_MIME={epub:['application/epub+zip','application/octet-stream'],docx:['application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/octet-stream'],pdf:['application/pdf','application/octet-stream'],jpg:['image/jpeg'],jpeg:['image/jpeg'],png:['image/png'],webp:['image/webp']};
let materialBusy=false;
function materialExt(name){return (name.split('.').pop()||'').toLowerCase()}
function materialSize(n){return n<1048576?Math.ceil(n/1024)+' КБ':(n/1048576).toFixed(1)+' МБ'}
function materialsView(b){
 const files=Array.isArray(b.materials)?b.materials:[];
 const groups=[...new Set(files.map(x=>x.groupId))];
 return `<h3>Приватные материалы</h3><p class="small muted">EPUB, DOCX, PDF и изображения · до 25 МБ. Доступ только после входа.</p>
 <div class="field"><label>Добавить файл<input type="file" id="material-upload" accept=".epub,.docx,.pdf,.jpg,.jpeg,.png,.webp" ${materialBusy?'disabled':''}></label></div>
 ${files.length?groups.map(g=>{let vs=files.filter(x=>x.groupId===g).sort((a,b)=>b.version-a.version);return `<div class="item"><b>${esc(vs[0].name)}</b><div class="small muted">${vs.length} верс. · ${esc(vs[0].type||'Материал')}</div>${vs.map(f=>`<div class="row between wrap" style="margin-top:10px"><div class="small">v${f.version} · ${materialSize(f.size)}<br><span class="muted">${esc(new Date(f.createdAt).toLocaleDateString('ru-RU'))}</span></div><div class="row wrap"><button class="btn secondary smallbtn" data-material-download="${esc(f.id)}">Скачать</button><button class="btn ghost smallbtn" data-material-delete="${esc(f.id)}">Удалить</button></div></div>`).join('')}<button class="btn secondary smallbtn" style="margin-top:10px" data-material-version="${esc(g)}">+ Новая версия</button></div>`}).join(''):empty('Материалы пока не загружены','Выбери файл выше, чтобы добавить его в защищённое хранилище.')}
 <p class="small muted">Экспорт JSON сохраняет список материалов, но не сами файлы. Не удаляй книгу с файлами до добавления очистки Storage.</p>`;
}
function materialFileById(id){let b=book(detailId);return b?.materials?.find(x=>x.id===id)}
async function uploadMaterial(file,groupId=null){
 if(!cloudReady||!activeUser||!client)throw Error('Сначала войдите в приложение');
 const ext=materialExt(file.name),allowed=MATERIAL_MIME[ext];
 if(!allowed||!allowed.includes(file.type||'application/octet-stream'))throw Error('Разрешены EPUB, DOCX, PDF, JPG, PNG, WebP');
 if(!file.size||file.size>26214400)throw Error('Размер файла должен быть от 1 байта до 25 МБ');
 const b=book(detailId);if(!b)throw Error('Книга не найдена');
 const group=groupId||uid();const existing=(b.materials||[]).filter(x=>x.groupId===group);
 const id=uid(),version=Math.max(0,...existing.map(x=>x.version||0))+1;
 const safeName=file.name.replace(/[^\p{L}\p{N}._-]/gu,'_').slice(-110)||('file.'+ext);
 const path=`${activeUser.id}/${b.id}/${id}/${safeName}`;
 const {error}=await client.storage.from(MATERIAL_BUCKET).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
 if(error)throw error;
 b.materials=b.materials||[];
 b.materials.push({id,groupId:group,version,name:file.name,size:file.size,type:ext,path,createdAt:new Date().toISOString()});
 logBook(b,'Загружен файл: '+file.name+' (v'+version+')');save();render();
 alert('Файл загружен. Дождись статуса «Сохранено», чтобы закрепить его в списке.');
}
async function downloadMaterial(id){
 const f=materialFileById(id);if(!f)throw Error('Файл не найден');
 const {data,error}=await client.storage.from(MATERIAL_BUCKET).download(f.path);if(error)throw error;
 const url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=f.name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function deleteMaterial(id){
 const b=book(detailId),f=materialFileById(id);if(!f)return;
 if(!confirm(`Удалить файл «${f.name}» (версия ${f.version}) без возможности восстановления?`))return;
 const {error}=await client.storage.from(MATERIAL_BUCKET).remove([f.path]);if(error)throw error;
 b.materials=b.materials.filter(x=>x.id!==id);logBook(b,'Удалён файл: '+f.name+' (v'+f.version+')');save();render();
}
document.addEventListener('change',async e=>{
 if(e.target.id!=='material-upload')return;
 const f=e.target.files?.[0];if(!f||materialBusy)return;
 materialBusy=true;const bookId=detailId;try{await uploadMaterial(f);}
 catch(err){alert('Не удалось загрузить: '+err.message)}finally{materialBusy=false;if(bookId===detailId)render()}
});
document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-material-download],[data-material-delete],[data-material-version]');if(!btn||materialBusy)return;
 if(btn.dataset.materialVersion){
  const group=btn.dataset.materialVersion;
  const input=document.createElement('input');input.type='file';input.accept='.epub,.docx,.pdf,.jpg,.jpeg,.png,.webp';
  input.onchange=async()=>{const f=input.files?.[0];if(!f)return;materialBusy=true;try{await uploadMaterial(f,group)}catch(err){alert('Не удалось загрузить версию: '+err.message)}finally{materialBusy=false;render()}};
  input.click();return;
 }
 materialBusy=true;btn.disabled=true;
 try{if(btn.dataset.materialDownload)await downloadMaterial(btn.dataset.materialDownload);else await deleteMaterial(btn.dataset.materialDelete)}
 catch(err){alert('Ошибка файла: '+err.message)}finally{materialBusy=false;btn.disabled=false}
});

startCloud();
</script></body></html>
