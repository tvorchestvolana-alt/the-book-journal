y:grid;place-items:center;overflow:hidden;color:#fff;font:28px Georgia,serif}.cover img{width:100%;height:100%;object-fit:cover}.bookcard strong{display:block;margin:9px 0 2px;overflow-wrap:anywhere}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.chips{display:flex;gap:7px;overflow:auto;padding:5px 0}.chip{border:1px solid var(--beige);background:var(--ivory);color:var(--dark);border-radius:25px;padding:7px 12px;white-space:nowrap}.chip.active{background:var(--coffee);color:#fff}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-size:13px;color:#705846}input,select,textarea{border:1px solid var(--beige);background:#fffefa;border-radius:10px;padding:11px;width:100%;color:var(--dark)}textarea{min-height:95px;resize:vertical}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffcf7f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:5px 0}.nav span{font-size:21px}.nav.active{color:var(--dark);font-weight:700}.fab{position:fixed;bottom:88px;right:18px;width:53px;height:53px;border:0;border-radius:50%;background:var(--dark);color:#fff;font-size:30px;box-shadow:0 5px 15px #493a3040;z-index:9}.modalbg{position:fixed;inset:0;background:#271c1680;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);width:100%;max-width:570px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px}.item{background:var(--ivory);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}.item.overdue{background:#f5e8e4}.item.done{background:#ede7df;color:#948679}.item.done .taskname{text-decoration:line-through}.taskname{font-weight:600}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{border:1px solid var(--beige);background:var(--ivory);border-radius:10px;padding:8px 10px;white-space:nowrap;color:var(--dark)}.tab.active{background:#e7d8c5}.progress{height:8px;background:#e9ded0;border-radius:9px;overflow:hidden}.progress div{height:100%;background:var(--coffee)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--ivory);color:var(--dark);padding:5px 2px;font-size:12px}.day.selected{background:#e7d8c5;border-color:var(--coffee)}.day.today{outline:1px solid var(--coffee)}.dot{display:block;width:5px;height:5px;background:var(--coffee);border-radius:50%;margin:3px auto}.desktopnav{display:none}.empty{padding:25px 12px;text-align:center;color:var(--muted)}.empty .emoji{font-size:30px}.note{border-left:3px solid var(--coffee);padding-left:12px}.detailcover{width:98px;flex:none}.detailcover .cover{width:98px}.warn{background:#f5e8e4;padding:10px;border-radius:9px;color:#86594b}.menu{position:absolute;right:14px;top:62px;background:var(--ivory);padding:10px;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #493a3025;z-index:12}.menu button{display:block;border:0;background:none;padding:10px;text-align:left;width:100%}@media(min-width:780px){.layout{padding-left:190px;padding-bottom:45px}.bottom{display:none}.desktopnav{display:flex;position:fixed;top:85px;left:max(12px,calc((100vw - 1100px)/2));width:160px;flex-direction:column;gap:6px}.desktopnav .nav{flex-direction:row;gap:10px;font-size:14px;padding:11px;text-align:left;border-radius:12px}.desktopnav .nav.active{background:#e7d8c5}.fab{right:max(24px,calc((100vw - 1050px)/2))}.bookgrid{grid-template-columns:repeat(4,1fr)}.modalbg{align-items:center}.modal{border-radius:20px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div><div class="brand">THE BOOK JOURNAL</div><div class="sub">Мой книжный ежедневник</div></div><button class="btn secondary smallbtn" id="menubtn" aria-label="Дополнительное меню">☰ Меню</button><div id="menu" class="menu" hidden></div></header><aside class="desktopnav" id="desktopnav"></aside><main class="layout" id="app"></main><nav class="bottom" id="bottomnav"></nav><button class="fab" id="add" aria-label="Добавить">+</button><div id="modalhost"></div><script>
const KEY='tbj-v1';const stages=['Перевод','Редактура','Вычитка','Оформление','Готово','Опубликовано'];const shelves=['На рассмотрении','В планах','В работе','Готовые','Опубликованные','Отложенные'];const icons={home:'⌂',books:'▥',calendar:'▦',work:'▤',tasks:'☑'};const nav=[['home','Главная'],['books','Книги'],['calendar','Календарь'],['work','Работа'],['tasks','Задачи']];let db=load(),page='home',filter='Все',search='',selectedDate=today(),month=selectedDate.slice(0,7),stageTab='Перевод',detailId=null,detailTab='Обзор',menuOpen=false;function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.books)&&Array.isArray(x.tasks)?x:{books:[],tasks:[],events:[],notes:[]}}catch{return {books:[],tasks:[],events:[],notes:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('Не удалось сохранить данные. Возможно, хранилище браузера переполнено.');return false}}function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmt(d){if(!d)return 'Без даты';let a=d.split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d}function book(id){return db.books.find(b=>b.id===id)}function cover(b){return `<div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="Обложка">`:'✦'}</div>`}function head(t,extra=''){return `<div class="sectionhead"><h2>${t}</h2>${extra}</div>`}function empty(t,s=''){return `<div class="empty"><div class="emoji">♡</div><p>${t}</p><span class="small">${s}</span></div>`}function navRender(){let h=nav.map(([k,t])=>`<button class="nav ${page===k?'active':''}" data-page="${k}"><span>${icons[k]}</span>${t}</button>`).join('');document.getElementById('bottomnav').innerHTML=h;document.getElementById('desktopnav').innerHTML=h}function setPage(p){page=p;detailId=null;menuOpen=false;render();scrollTo(0,0)}function render(){navRender();document.getElementById('menu').hidden=!menuOpen;document.getElementById('menu').innerHTML=['Серии','Статистика','Заметки','Настройки'].map(x=>`<button data-extra="${x}">${x}</button>`).join('');document.getElementById('app').innerHTML=detailId?detailView():({home:homeView,books:booksView,calendar:calendarView,work:workView,tasks:tasksView,series:seriesView,stats:statsView,notes:notesView,settings:settingsView}[page]||homeView)()}
function homeView(){let active=db.books.filter(b=>stages.slice(0,4).includes(b.stage)&&!b.paused);let upcoming=[...db.events.map(e=>({title:e.title,date:e.date})),...db.books.filter(b=>b.planned).map(b=>({title:'Публикация · '+b.title,date:b.planned}))].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return `<h1>Моя книжная полка</h1><p class="muted">Место для каждой истории и каждого этапа её создания.</p><div class="grid"><div class="stat"><b>${db.books.length}</b>Книг</div><div class="stat"><b>${active.length}</b>В работе</div><div class="stat"><b>${db.tasks.filter(t=>!t.done).length}</b>Активных задач</div><div class="stat"><b>${db.books.filter(b=>b.stage==='Опубликовано').length}</b>Опубликовано</div></div>${head('Сейчас в работе',`<button class="btn ghost smallbtn" data-page="work">Все этапы →</button>`)}${active.length?`<div class="bookgrid">${active.slice(0,4).map(bookTile).join('')}</div>`:empty('Пока нет активных книг','Добавьте первую книгу кнопкой +')}${head('Ближайшие события')}${upcoming.length?upcoming.map(e=>`<div class="item row between"><span>${esc(e.title)}</span><span class="small muted">${fmt(e.date)}</span></div>`).join(''):empty('Пока нет запланированных событий')}${head('Задачи',`<button class="btn ghost smallbtn" data-page="tasks">Все задачи →</button>`)}${taskList(db.tasks.filter(t=>!t.done).slice(0,3))}`}
function bookTile(b){return `<button class="bookcard" data-book="${b.id}">${cover(b)}<strong>${esc(b.title)}</strong><div class="small muted">${esc(b.author)}</div><span class="pill">${esc(b.paused?'На паузе':b.stage)}</span></button>`}function booksView(){let list=db.books.filter(b=>(filter==='Все'||b.shelf===filter)&&(`${b.title} ${b.author} ${b.series||''} ${b.titleEn||''}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));return `<h1>Библиотека</h1><div class="field"><input id="search" placeholder="Поиск по книгам, авторам и сериям" value="${esc(search)}"></div><div class="chips">${['Все',...shelves].map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div>${head(`Книги · ${list.length}`,`<button class="btn secondary smallbtn" data-create="book">+ Книга</button>`)}${list.length?`<div class="bookgrid">${list.map(bookTile).join('')}</div>`:empty('Здесь пока нет книг','Добавьте книгу, чтобы начать вести библиотеку')}`}
function workView(){let list=db.books.filter(b=>b.stage===stageTab);return `<h1>Работа</h1><p class="muted">Этапы переводческих проектов</p><div class="chips">${stages.slice(0,4).map(s=>`<button class="chip ${stageTab===s?'active':''}" data-stage="${s}">${s} · ${db.books.filter(b=>b.stage===s).length}</button>`).join('')}</div>${head(stageTab)}${list.filter(b=>!b.paused).length?list.filter(b=>!b.paused).map(workItem).join(''):empty('На этом этапе пока нет активных книг')}${list.some(b=>b.paused)?`<details class="card"><summary>На паузе · ${list.filter(b=>b.paused).length}</summary>${list.filter(b=>b.paused).map(workItem).join('')}</details>`:''}`}
function workItem(b){let n=stageTab==='Перевод'?b.translated:stageTab==='Редактура'?b.edited:b.proofread;return `<div class="item row between"><div><b>${esc(b.title)}</b><div class="small muted">${esc(b.author)} · Глав: ${n||0}${b.total?'/'+b.total:''}</div></div><button class="btn secondary smallbtn" data-book="${b.id}">Открыть</button></div>`}
function taskList(tasks){return tasks.length?tasks.map(t=>`<div class="item ${t.done?'done':''} ${!t.done&&t.due&&t.due<today()?'overdue':''} row"><input type="checkbox" style="width:20px;flex:none" data-check="${t.id}" ${t.done?'checked':''} aria-label="Выполнить задачу"><div style="flex:1;min-width:0" data-task="${t.id}"><div class="taskname">${esc(t.title)}</div><div class="small muted">${t.bookId?esc(book(t.bookId)?.title||'')+' · ':''}${t.due?fmt(t.due):'Без срока'}${t.priority==='Высокий'?' · Высокий приоритет':''}</div></div><button class="btn ghost smallbtn" data-task="${t.id}" aria-label="Открыть задачу">⋯</button></div>`).join(''):empty('Задач пока нет')}
function tasksView(){let a=db.tasks.filter(t=>!t.done).sort((x,y)=>({Высокий:0,Обычный:1,Низкий:2}[x.priority]||1)-({Высокий:0,Обычный:1,Низкий:2}[y.priority]||1)||(x.due||'9999').localeCompare(y.due||'9999'));return `<h1>Задачи</h1>${head('Активные',`<button class="btn secondary smallbtn" data-create="task">+ Задача</button>`)}${taskList(a)}${head(`Выполненные · ${db.tasks.filter(t=>t.done).length}`)}${taskList(db.tasks.filter(t=>t.done))}`}
function calendarView(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array(offset).fill('<div></div>');for(let d=1;d<=days;d++){let date=`${month}-${String(d).padStart(2,'0')}`;let count=db.events.filter(e=>e.date===date).length+db.tasks.filter(t=>t.due===date).length+db.books.filter(b=>b.planned===date||b.actual===date).length;cells.push(`<button class="day ${date===selectedDate?'selected':''} ${date===today()?'today':''}" data-date="${date}">${d}${count?`<span class="dot"></span>${count>2?`<span class="small">${count}</span>`:''}`:''}</button>`)}let items=[...db.events.filter(e=>e.date===selectedDate).map(e=>({name:e.title,type:'Событие'})),...db.tasks.filter(t=>t.due===selectedDate).map(t=>({name:t.title,type:'Задача'})),...db.books.filter(b=>b.planned===selectedDate).map(b=>({name:b.title,type:'План публикации'})),...db.books.filter(b=>b.actual===selectedDate).map(b=>({name:b.title,type:'Опубликовано'}))];return `<h1>Календарь</h1><div class="card"><div class="row between"><button class="btn ghost" data-month="-1">‹</button><h3>${new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h3><button class="btn ghost" data-month="1">›</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells.join('')}</div></div>${head(`События · ${fmt(selectedDate)}`,`<button class="btn secondary smallbtn" data-create="event">+ Событие</button>`)}${items.length?items.map(e=>`<div class="item"><span class="pill">${e.type}</span> ${esc(e.name)}</div>`).join(''):empty('На этот день событий нет')}<p class="small muted">Планы без точного дня появятся в карточке книги.</p>`}
function detailView(){let b=book(detailId);if(!b){detailId=null;return booksView()}let tabs=['Обзор','Прогресс','Оформление','Материалы','Планы','Заметки','История'];let body='';if(detailTab==='Обзор')body=`<p><b>Название:</b> ${esc(b.title)}</p>${b.titleEn?`<p><b>Оригинал:</b> ${esc(b.titleEn)}</p>`:''}<p><b>Автор:</b> ${esc(b.author)}</p><p><b>Серия:</b> ${esc(b.series||'Не указана')}</p><p><b>Полка:</b> ${esc(b.shelf)}</p><p><b>Этап:</b> ${esc(b.stage)} ${b.paused?'· На паузе':''}</p><p>${esc(b.description||'Аннотация пока не добавлена.')}</p><div class="row wrap"><button class="btn secondary" data-editbook="${b.id}">Редактировать</button><button class="btn secondary" data-togglepause="${b.id}">${b.paused?'Возобновить':'На паузу'}</button></div><div class="field"><label>Изменить этап</label><select data-changestage="${b.id}">${stages.map(s=>`<option ${s===b.stage?'selected':''}>${s}</option>`).join('')}</select></div>`;if(detailTab==='Прогресс')body=`<p class="muted">Счётчики глав сохраняются в браузере.</p>${[['Переведено','translated'],['Отредактировано','edited'],['Вычитано','proofread']].map(([label,key])=>`<div class="item"><div class="row between"><b>${label}</b><div class="row"><button class="btn secondary smallbtn" data-counter="${key}" data-delta="-1">−</button><b>${b[key]||0}${b.total?'/'+b.total:''}</b><button class="btn secondary smallbtn" data-counter="${key}" data-delta="1">+</button></div></div>${b.total?`<div class="progress" style="margin-top:10px"><div style="width:${Math.min(100,100*(b[key]||0)/b.total)}%"></div></div>`:''}</div>`).join('')}<button class="btn secondary" data-editbook="${b.id}">Изменить общее число глав</button>`;if(detailTab==='Оформление'){let checks=b.checks||defaultChecks();body=checks.map((c,i)=>`<div class="item row"><input type="checkbox" style="width:20px" data-format="${i}" ${c.done?'checked':''}><span>${esc(c.title)}</span></div>`).join('')+'<p class="small muted">Дополнительные пункты и шаблоны появятся после подключения облачной версии.</p>'}if(detailTab==='Материалы')body=empty('Материалы пока не загружены','Загрузка EPUB, DOCX и обложек будет подключена вместе с приватным хранилищем Supabase.');if(detailTab==='Планы'){let dates=[['Начало работы',b.started],['Планируемая публикация',b.planned],['Фактическая публикация',b.actual]].filter(x=>x[1]);body=`<button class="btn secondary" data-editbook="${b.id}">Изменить важные даты</button>${dates.map(([n,d])=>`<div class="item" style="${n==='Фактическая публикация'?'background:#e7d8c5':''}"><div class="small muted">${fmt(d)}</div><b>${n}</b>${n==='Фактическая публикация'&&b.planned?`<div class="small">${diffDates(b.planned,b.actual)}</div>`:''}</div>`).join('')}${head('Задачи книги',`<button class="btn secondary smallbtn" data-create="task" data-linked="${b.id}">+ Задача</button>`)}${taskList(db.tasks.filter(t=>t.bookId===b.id))}`}if(detailTab==='Заметки')body=`<button class="btn secondary" data-create="note" data-linked="${b.id}">+ Заметка</button>${db.notes.filter(n=>n.bookId===b.id).map(n=>`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join('')||empty('Заметок пока нет')}`;if(detailTab==='История')body=empty('История изменений появится после подключения Supabase','Временная версия хранит текущее состояние без журнала изменений.');return `<button class="btn ghost" data-back="1">← К библиотеке</button><div class="card row" style="align-items:start"><div class="detailcover">${cover(b)}</div><div style="min-width:0"><h2>${esc(b.title)}</h2><p class="muted">${esc(b.author)}</p><span class="pill">${esc(b.stage)}</span></div></div><div class="field"><label>Раздел книги</label><select id="detailtab">${tabs.map(t=>`<option ${t===detailTab?'selected':''}>${t}</option>`).join('')}</select></div><div class="card">${body}</div>`}
function diffDates(a,b){if(!/^\d{4}-\d\d-\d\d$/.test(a)||!/^\d{4}-\d\d-\d\d$/.test(b))return '';let delta=Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);return delta===0?'По плану':`${Math.abs(delta)} дн. ${delta>0?'позже':'раньше'} плана`}
function seriesView(){let names=[...new Set(db.books.map(b=>b.series).filter(Boolean))];return `<h1>Серии</h1>${names.length?names.map(n=>`<div class="card"><h3>${esc(n)}</h3>${db.books.filter(b=>b.series===n).map(b=>`<div class="item row between"><span>${esc(b.title)}</span><button class="btn secondary smallbtn" data-book="${b.id}">Открыть</button></div>`).join('')}</div>`).join(''):empty('Серий пока нет','Укажите серию в карточке книги')}`}
function statsView(){return `<h1>Статистика</h1><div class="grid"><div class="stat"><b>${db.books.length}</b>Всего книг</div><div class="stat"><b>${db.books.filter(b=>b.stage==='Опубликовано').length}</b>Опубликовано</div><div class="stat"><b>${db.books.reduce((s,b)=>s+(+b.translated||0),0)}</b>Переведено глав</div><div class="stat"><b>${db.tasks.filter(t=>t.done).length}</b>Завершено задач</div></div><p class="small muted">Это общие текущие показатели. Статистика по периодам появится после подключения истории изменений.</p>`}
function notesView(){return `<h1>Заметки</h1><button class="btn secondary" data-create="note">+ Заметка</button>${db.notes.filter(n=>!n.bookId).map(n=>`<div class="card note"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div>`).join('')||empty('Общих заметок пока нет')}`}
function settingsView(){return `<h1>Настройки</h1><div class="card"><h3>Данные и резервные копии</h3><p class="small muted">Данные пока хранятся только в этом браузере. Очистка данных сайта может удалить их.</p><button class="btn secondary" id="export">Скачать резервную копию JSON</button><div class="field"><label>Восстановить из JSON</label><input type="file" id="import" accept="application/json,.json"></div></div><div class="card"><h3>О приложении</h3><p>THE BOOK JOURNAL · Первая локальная версия</p><p class="small muted">Облачное хранение, авторизация и загрузка материалов будут добавлены позднее.</p></div>`}
function defaultChecks(){return ['Русификация обложки','Вёрстка EPUB','Оглавление','Переписки и дополнительные элементы','Проверка в читалке','Финальный файл'].map(title=>({title,done:false}))}
function showModal(html){document.getElementById('modalhost').innerHTML=`<div class="modalbg" id="modalbg"><div class="modal"><div class="row between"><h2>${html.title}</h2><button class="btn ghost" data-close="1">✕</button></div>${html.body}</div></div>`}function closeModal(){document.getElementById('modalhost').innerHTML=''}function options(list,chosen){return list.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')}
function formBook(id){let b=book(id)||{};showModal({title:id?'Редактировать книгу':'Добавить книгу',body:`<form id="bookform" data-id="${id||''}"><div class="field"><label>Название *</label><input name="title" required value="${esc(b.title)}"></div><div class="field"><label>Автор *</label><input name="author" required value="${esc(b.author)}"></div><div class="field"><label>Название на английском</label><input name="titleEn" value="${esc(b.titleEn)}"></div><div class="field"><label>Серия</label><input name="series" value="${esc(b.series)}"></div><div class="field"><label>Полка</label><select name="shelf">${options(shelves,b.shelf||'В планах')}</select></div><div class="field"><label>Этап</label><select name="stage">${options(stages,b.stage||'Перевод')}</select></div><div class="field"><label>Всего глав (0 — неизвестно)</label><input name="total" type="number" min="0" value="${b.total||0}"></div><div class="field"><label>Начало работы</label><input name="started" type="date" value="${b.started||''}"></div><div class="field"><label>Планируемая публикация</label><input name="planned" type="date" value="${b.planned||''}"></div><div class="field"><label>Фактическая публикация</label><input name="actual" type="date" value="${b.actual||''}"></div><div class="field"><label>Аннотация</label><textarea name="description">${esc(b.description)}</textarea></div><div class="field"><label>Обложка (небольшой файл, хранится в браузере)</label><input name="cover" type="file" accept="image/*"></div><button class="btn" type="submit">Сохранить книгу</button>${id?` <button class="btn secondary" type="button" data-deletebook="${id}">Удалить книгу</button>`:''}</form>`})}
function formTask(id,linked){let t=db.tasks.find(x=>x.id===id)||{};showModal({title:id?'Редактировать задачу':'Новая задача',body:`<form id="taskform" data-id="${id||''}"><div class="field"><label>Название *</label><input name="title" required value="${esc(t.title)}"></div><div class="field"><label>Срок</label><input name="due" type="date" value="${t.due||''}"></div><div class="field"><label>Приоритет</label><select name="priority">${options(['Высокий','Обычный','Низкий'],t.priority||'Обычный')}</select></div><div class="field"><label>Книга</label><select name="bookId"><option value="">Без книги</option>${db.books.map(b=>`<option value="${b.id}" ${(t.bookId||linked)===b.id?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div><div class="field"><label>Описание</label><textarea name="description">${esc(t.description)}</textarea></div><button class="btn" type="submit">Сохранить задачу</button>${id?` <button class="btn secondary" type="button" data-deletetask="${id}">Удалить</button>`:''}</form>`})}
function formEvent(){showModal({title:'Новое событие',body:`<form id="eventform"><div class="field"><label>Название *</label><input name="title" required></div><div class="field"><label>Дата *</label><input name="date" type="date" required value="${selectedDate}"></div><div class="field"><label>Описание</label><textarea name="description"></textarea></div><button class="btn">Сохранить событие</button></form>`})}function formNote(linked){showModal({title:'Новая заметка',body:`<form id="noteform" data-linked="${linked||''}"><div class="field"><label>Заголовок *</label><input name="title" required></div><div class="field"><label>Текст</label><textarea name="body"></textarea></div><button class="btn">Сохранить заметку</button></form>`})}function createMenu(){showModal({title:'Что добавить?',body:`<div class="grid">${[['book','Книгу'],['task','Задачу'],['event','Событие'],['note','Заметку']].map(([k,t])=>`<button class="btn secondary" data-create="${k}">${t}</button>`).join('')}</div>`})}
function goCreate(type,linked){if(type==='book')formBook();if(type==='task')formTask(null,linked);if(type==='event')formEvent();if(type==='note')formNote(linked)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-extra],[data-filter],[data-stage],[data-book],[data-back],[data-create],[data-task],[data-close],[data-togglepause],[data-editbook],[data-counter],[data-month],[data-date],[data-deletebook],[data-deletetask]');if(!el)return;let d=el.dataset;if(d.page){setPage(d.page)}else if(d.extra){setPage(({Серии:'series',Статистика:'stats',Заметки:'notes',Настройки:'settings'})[d.extra])}else if(d.filter){filter=d.filter;render()}else if(d.stage){stageTab=d.stage;render()}else if(d.book){detailId=d.book;detailTab='Обзор';page='books';closeModal();render();scrollTo(0,0)}else if(d.back){detailId=null;render()}else if(d.create){goCreate(d.create,d.linked)}else if(d.task){formTask(d.task)}else if(d.close){closeModal()}else if(d.togglepause){let b=book(d.togglepause);b.paused=!b.paused;b.updated=new Date().toISOString();save();render()}else if(d.editbook){formBook(d.editbook)}else if(d.counter){let b=book(detailId),key=d.counter,v=(+b[key]||0)+(+d.delta);if(v<0)return;if(b.total&&v>b.total)return alert('Число глав не может превышать общее количество.');let copy={...b,[key]:v};if((copy.proofread||0)>(copy.edited||0)||(copy.edited||0)>(copy.translated||0))return alert('Вычитанных глав не может быть больше отредактированных, а отредактированных — больше переведённых.');b[key]=v;b.updated=new Date().toISOString();save();render()}else if(d.month){let [y,m]=month.split('-').map(Number);let nd=new Date(y,m-1+Number(d.month),1);month=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');selectedDate=month+'-01';render()}else if(d.date){selectedDate=d.date;render()}else if(d.deletebook){if(confirm('Удалить книгу и её связанные задачи? В этой временной версии корзины ещё нет.')){db.books=db.books.filter(b=>b.id!==d.deletebook);db.tasks=db.tasks.filter(t=>t.bookId!==d.deletebook);save();closeModal();detailId=null;render()}}else if(d.deletetask){if(confirm('Удалить задачу?')){db.tasks=db.tasks.filter(t=>t.id!==d.deletetask);save();closeModal();render()}}});document.addEventListener('change',e=>{let d=e.target.dataset;if(e.target.id==='detailtab'){detailTab=e.target.value;render()}if(d.check){let t=db.tasks.find(x=>x.id===d.check);t.done=e.target.checked;save();render()}if(d.format!==undefined){let b=book(detailId);b.checks=b.checks||defaultChecks();b.checks[+d.format].done=e.target.checked;save();render()}if(d.changestage){let b=book(d.changestage);if(e.target.value==='Опубликовано'&&!b.actual){alert('Укажите фактическую дату публикации перед переходом в «Опубликовано».');render();return}b.stage=e.target.value;b.updated=new Date().toISOString();save();render()}if(e.target.id==='import'){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let x=JSON.parse(t);if(!Array.isArray(x.books)||!Array.isArray(x.tasks))throw Error('Неверный формат');if(confirm('Заменить все локальные данные содержимым резервной копии?')){db={books:x.books,tasks:x.tasks,events:Array.isArray(x.events)?x.events:[],notes:Array.isArray(x.notes)?x.notes:[]};save();render()}}).catch(()=>alert('Не удалось прочитать JSON'))}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}});document.addEventListener('submit',async e=>{if(!['bookform','taskform','eventform','noteform'].includes(e.target.id))return;e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='bookform'){let old=book(f.dataset.id),total=+v.total||0;if(old&&total&&Math.max(old.translated||0,old.edited||0,old.proofread||0)>total)return alert('Общее число глав меньше уже выполненного прогресса.');if(v.stage==='Опубликовано'&&!v.actual)return alert('Для этапа «Опубликовано» нужна фактическая дата.');let duplicate=db.books.find(b=>b.id!==f.dataset.id&&b.title.toLowerCase()===v.title.trim().toLowerCase()&&b.author.toLowerCase()===v.author.trim().toLowerCase());if(duplicate&&!confirm('Похожая книга уже есть. Всё равно сохранить?'))return;let img=f.querySelector('[name=cover]').files[0],data=old?.cover||'';if(img){if(img.size>400000)return alert('Для первой версии выберите обложку меньше 400 КБ.');data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(img)})}let b={...old,...v,title:v.title.trim(),author:v.author.trim(),total,cover:data,updated:new Date().toISOString(),id:old?.id||uid(),translated:old?.translated||0,edited:old?.edited||0,proofread:old?.proofread||0,paused:old?.paused||false,checks:old?.checks||defaultChecks()};if(old)Object.assign(old,b);else db.books.push(b);save();closeModal();detailId=b.id;detailTab='Обзор';page='books';render()}if(f.id==='taskform'){let old=db.tasks.find(t=>t.id===f.dataset.id),t={...old,...v,id:old?.id||uid(),done:old?.done||false};if(old)Object.assign(old,t);else db.tasks.push(t);save();closeModal();render()}if(f.id==='eventform'){db.events.push({...v,id:uid()});save();closeModal();render()}if(f.id==='noteform'){db.notes.push({...v,id:uid(),bookId:f.dataset.linked||''});save();closeModal();render()}});document.getElementById('menubtn').onclick=()=>{menuOpen=!menuOpen;render()};document.getElementById('add').onclick=createMenu;document.addEventListener('click',e=>{if(e.target.id==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-book-journal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});render();
</script></body></html>
